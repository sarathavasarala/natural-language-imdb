<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="IMDb Intelligence">
  <defs>
    <!-- Rich Cinema Gold Gradient -->
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="30%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#D49400"/>
    </linearGradient>

    <!-- Deep Slate Obsidian Fill -->
    <linearGradient id="slateDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
  </defs>

  <!-- Gold Rounded Squircle Badge (Transparent Canvas) -->
  <rect x="56" y="56" width="912" height="912" rx="224" fill="url(#badgeGold)"/>

  <!-- Cinema Clapperboard Silhouette -->
  <g fill="url(#slateDark)">
    <!-- Angled Top Slate -->
    <g transform="rotate(-6 220 370)">
      <!-- Top Slate Base -->
      <path d="M 210 248 C 210 230 224 216 242 216 L 782 216 C 800 216 814 230 814 248 L 814 340 C 814 358 800 372 782 372 L 242 372 C 224 372 210 358 210 340 Z"/>
      
      <!-- Gold Diagonal Cutout Slashes -->
      <path d="M 330 216 L 405 216 L 335 372 L 260 372 Z" fill="url(#badgeGold)"/>
      <path d="M 485 216 L 560 216 L 490 372 L 415 372 Z" fill="url(#badgeGold)"/>
      <path d="M 640 216 L 715 216 L 645 372 L 570 372 Z" fill="url(#badgeGold)"/>
      <path d="M 785 216 L 814 216 L 814 250 L 795 372 L 725 372 Z" fill="url(#badgeGold)"/>
    </g>

    <!-- Lower Board -->
    <rect x="210" y="396" width="604" height="400" rx="32"/>

    <!-- Subtle Gold Horizon Line / Production Header -->
    <rect x="270" y="460" width="484" height="24" rx="8" fill="url(#badgeGold)" opacity="0.9"/>
    
    <!-- Central AI Intelligence Star Mark -->
    <path d="M 512 525 Q 512 625 412 625 Q 512 625 512 725 Q 512 625 612 625 Q 512 625 512 525 Z" fill="url(#badgeGold)"/>
  </g>
</svg>
