name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Verify Build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import app; print('Application build check passed')"
          python -m unittest discover -s tests -v

      - name: Package Application
        run: |
          zip -r deploy.zip app scripts/sync_duckdb_database.py run.py config.template.py requirements.txt -x "*.DS_Store" "*__pycache__*" "*.git*"

      - name: Deploy to Azure Web App
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'imdb-intelligence-app'
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip

      - name: Warm Up Application & Pre-load Database Cache
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        run: |
          echo "Warming up Azure Web App instance..."
          curl -s -f --retry 3 --retry-delay 5 --max-time 30 https://imdb-intelligence-app.azurewebsites.net/api/config-status || true

      - name: Notice on Missing Publish Profile
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        run: |
          echo "::notice::AZURE_WEBAPP_PUBLISH_PROFILE secret is not configured in GitHub repository secrets. Build and test verification passed, but deployment was skipped. To enable auto-deployment, add AZURE_WEBAPP_PUBLISH_PROFILE in Repository Settings > Secrets > Actions."
